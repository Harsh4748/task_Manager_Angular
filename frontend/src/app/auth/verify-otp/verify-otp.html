<div class="w-screen h-screen flex items-center justify-center
            bg-gray-100">

  <div class="bg-white rounded-xl shadow-lg
              w-full max-w-md p-8 text-center">

    <h2 class="text-3xl font-bold text-gray-800 mb-2">
      Verify OTP 🔐
    </h2>

    <p class="text-gray-500 mb-6">
      Enter the 6-digit OTP sent to your email
    </p>

    <!-- OTP INPUTS -->
<div class="flex justify-center gap-3 mb-6">

  <input
    *ngFor="let box of otp; let i = index"
    type="text"
    maxlength="1"
    inputmode="numeric"
    pattern="[0-9]*"

    class="w-12 h-12 text-center text-xl
           border rounded-lg
           focus:ring-2 focus:ring-purple-500"

    [value]="otp[i]"

    (input)="onOtpInput($event, i)"
    (keydown.backspace)="onBackspace($event, i)"
  />

</div>


    <!-- ERROR -->
    <p *ngIf="errorMsg"
       class="text-red-600 text-sm mb-3">
      {{ errorMsg }}
    </p>

    <!-- SUCCESS -->
    <p *ngIf="successMsg"
       class="text-green-600 text-sm mb-3">
      {{ successMsg }}
    </p>

    <!-- VERIFY BUTTON -->
    <button
      (click)="verifyOtp()"
      [disabled]="loading || loadingResend"
      class="w-full py-2 rounded-lg flex items-center justify-center gap-2
             bg-purple-600 text-white disabled:opacity-70 disabled:cursor-not-allowed
             hover:bg-purple-700 transition">
      <span *ngIf="loading" class="w-4 h-4 border-2 border-white/20 border-t-white rounded-full animate-spin"></span>
      {{ loading ? 'Verifying...' : 'Verify OTP' }}
    </button>

    <!-- RESEND -->
    <p class="mt-5 text-sm text-gray-600">
      Didn’t receive OTP?

      <button
        [disabled]="loading || loadingResend"
        class="text-purple-600 font-semibold hover:underline bg-transparent border-0 p-0 disabled:opacity-70 disabled:no-underline disabled:cursor-not-allowed inline-flex items-center gap-1"
        (click)="resendOtp()">
        <span *ngIf="loadingResend" class="w-3 h-3 border-2 border-purple-600/20 border-t-purple-600 rounded-full animate-spin"></span>
        {{ loadingResend ? 'Resending...' : 'Resend OTP' }}
      </button>
    </p>

  </div>
</div>
