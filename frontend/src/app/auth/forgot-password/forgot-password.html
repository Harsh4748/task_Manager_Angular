<div class="w-screen h-screen flex items-center justify-center
            bg-gray-100">

  <div class="bg-white rounded-xl shadow-lg
              w-full max-w-md p-8">

    <h2 class="text-3xl font-bold text-center text-gray-800 mb-2">
      Forgot Password 🔐
    </h2>

    <p class="text-center text-gray-500 mb-6">
      Enter your registered email
    </p>

    <form (ngSubmit)="sendOtp()" novalidate>

      <!-- Email -->
      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-1">
          Email address
        </label>

        <input
          type="email"
          name="email"
          [(ngModel)]="email"
          #emailRef="ngModel"
          required
          email
          placeholder="Enter your email"
          class="w-full px-4 py-2 border rounded-lg
                 focus:ring-2 focus:ring-blue-500">

        <!-- validation -->
        <p class="text-red-500 text-sm mt-1"
           *ngIf="emailRef.invalid && (emailRef.touched || submitted)">

          <span *ngIf="emailRef.errors?.['required']">
            Email is required
          </span>

          <span *ngIf="emailRef.errors?.['email']">
            Enter valid email address
          </span>
        </p>
      </div>

      <!-- error -->
      <p *ngIf="errorMsg"
         class="text-red-600 text-sm text-center mb-3">
        {{ errorMsg }}
      </p>

      <!-- success -->
      <p *ngIf="successMsg"
         class="text-green-600 text-sm text-center mb-3">
        {{ successMsg }}
      </p>

      <button
        type="submit"
        [disabled]="loading"
        class="w-full py-2 rounded-lg text-white font-semibold flex items-center justify-center gap-2
               bg-blue-600 hover:bg-blue-700 disabled:opacity-70 disabled:cursor-not-allowed transition">
        <span *ngIf="loading" class="w-4 h-4 border-2 border-white/20 border-t-white rounded-full animate-spin"></span>
        {{ loading ? 'Sending...' : 'Send OTP' }}
      </button>

    </form>

    <p class="text-center text-sm text-gray-600 mt-6">
      Back to
      <a routerLink="/login"
         class="text-blue-600 font-semibold hover:underline">
        Login
      </a>
    </p>

  </div>
</div>
