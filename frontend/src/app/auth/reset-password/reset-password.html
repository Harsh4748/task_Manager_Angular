<div class="w-screen h-screen flex items-center justify-center
            bg-gray-100">

  <div class="bg-white rounded-xl shadow-lg
              w-full max-w-md p-8">

    <h2 class="text-3xl font-bold text-center text-gray-800 mb-2">
      Reset Password 🔑
    </h2>

    <p class="text-center text-gray-500 mb-6">
      Create a new password for your account
    </p>

    <form (ngSubmit)="resetPassword()" class="space-y-5" novalidate>

      <!-- NEW PASSWORD -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
          New Password
        </label>

        <input
          type="password"
          name="password"
          [(ngModel)]="password"
          required
          minlength="6"
          placeholder="Enter new password"
          class="form-control w-full px-4 py-2
                 border rounded-lg
                 focus:ring-2 focus:ring-indigo-500">

        <p class="text-red-500 text-sm mt-1"
           *ngIf="submitted && password.length < 6">
          Password must be at least 6 characters
        </p>
      </div>

      <!-- CONFIRM PASSWORD -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
          Confirm Password
        </label>

        <input
          type="password"
          name="confirmPassword"
          [(ngModel)]="confirmPassword"
          required
          placeholder="Confirm new password"
          class="form-control w-full px-4 py-2
                 border rounded-lg
                 focus:ring-2 focus:ring-indigo-500">

        <p class="text-red-500 text-sm mt-1"
           *ngIf="submitted && password !== confirmPassword">
          Passwords do not match
        </p>
      </div>

      <!-- ERROR -->
      <p *ngIf="errorMsg"
         class="text-red-600 text-sm text-center font-medium">
        {{ errorMsg }}
      </p>

      <!-- SUCCESS -->
      <p *ngIf="successMsg"
         class="text-green-600 text-sm text-center font-medium">
        {{ successMsg }}
      </p>

      <!-- BUTTON -->
      <button
        type="submit"
        [disabled]="loading"
        class="w-full py-2 rounded-lg flex items-center justify-center gap-2
               bg-indigo-600 text-white disabled:opacity-70 disabled:cursor-not-allowed
               hover:bg-indigo-700 transition">
        <span *ngIf="loading" class="w-4 h-4 border-2 border-white/20 border-t-white rounded-full animate-spin"></span>
        {{ loading ? 'Resetting...' : 'Reset Password' }}
      </button>

    </form>

  </div>
</div>
