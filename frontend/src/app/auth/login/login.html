<div class="w-screen h-screen flex items-center justify-center
            bg-gray-100
">

  <div class="bg-white rounded-xl shadow-lg
              w-full max-w-md p-8">

    <h2 class="text-3xl font-bold text-center text-gray-800 mb-2">
      Welcome Back 👋
    </h2>

    <p class="text-center text-gray-500 mb-6">
      Login to your account
    </p>

    <form (ngSubmit)="login()" class="space-y-5" novalidate>

      <!-- EMAIL -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
          Email address
        </label>

        <input type="email" name="email" [(ngModel)]="email" (ngModelChange)="emailError = ''"
          #emailRef="ngModel" required email placeholder="Enter your email" class="form-control w-full px-4 py-2
                 border rounded-lg
                 focus:ring-2 focus:ring-blue-500">

        <!-- validation message -->
        <p class="text-red-500 text-sm mt-1"
          *ngIf="emailRef.invalid && (emailRef.touched || emailRef.dirty || submitted)">

          <span *ngIf="emailRef.errors?.['required']">
            Email is required
          </span>

          <span *ngIf="emailRef.errors?.['email']">
            Enter valid email address
          </span>
        </p>
        <p class="text-red-500 text-sm mt-1" *ngIf="emailError">
          {{ emailError }}
        </p>

      </div>

      <!-- PASSWORD -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
          Password
        </label>

        <div class="relative">
          <input [type]="showPassword ? 'text' : 'password'" name="password" [(ngModel)]="password"
            (ngModelChange)="passwordError = ''" #passwordRef="ngModel" required minlength="6"
            placeholder="Enter your password" class="form-control w-full px-4 py-2 pr-10
             border rounded-lg
             focus:ring-2 focus:ring-blue-500">
          
          <button type="button" (click)="showPassword = !showPassword"
            class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 focus:outline-none">
            <svg *ngIf="!showPassword" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
            <svg *ngIf="showPassword" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
            </svg>
          </button>
        </div>

        <!-- ✅ Validation message -->
        <p class="text-red-500 text-sm mt-1"
          *ngIf="passwordRef.invalid && (passwordRef.touched || passwordRef.dirty || submitted)">

          <!-- required -->
          <span *ngIf="passwordRef.errors?.['required']">
            Password is required
          </span>

          <!-- minlength -->
          <span *ngIf="passwordRef.errors?.['minlength']">
            Password must be at least 6 characters
          </span>
        </p>
        <p *ngIf="loginError" class="text-red-600 text-sm mt-2 text-center font-medium">
          {{ loginError }}
        </p>
        <p class="text-red-500 text-sm mt-1" *ngIf="passwordError">
          {{ passwordError }}
        </p>

      </div>

      <div class="flex justify-end text-sm">
        <a routerLink="/forgot-password" class="text-blue-600 hover:underline cursor-pointer">
          Forgot password?
        </a>
      </div>

      <!-- BUTTON NOT DISABLED -->
      <button type="submit" class="w-full py-2 rounded-lg text-white font-semibold
               bg-blue-600 hover:bg-blue-700 transition">
        Login
      </button>

    </form>

    <p class="text-center text-sm text-gray-600 mt-6">
      Don’t have an account?
      <a routerLink="/signup" class="text-blue-600 font-semibold hover:underline cursor-pointer">
        Sign up
      </a>
    </p>

  </div>
</div>
