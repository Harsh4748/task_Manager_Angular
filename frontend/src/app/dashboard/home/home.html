<div class="min-h-screen bg-gray-100 dark:bg-gray-950 py-10 transition-colors duration-300">

  <div class="max-w-6xl mx-auto px-4">

    <!-- HEADER -->
    <div
      class="bg-white dark:bg-slate-900 rounded-2xl shadow-xl p-6 mb-6
             flex items-center justify-between border border-gray-100 dark:border-slate-800">

      <div>
        <h2 class="text-2xl font-bold text-slate-800 dark:text-white">
          Welcome 👋 <span class="text-blue-700 dark:text-blue-400 font-extrabold">{{ userName }}</span>
        </h2>

        <p class="text-sm text-slate-500 dark:text-slate-400">
          Manage your daily tasks
        </p>
      </div>

      <button
        (click)="logout()"
        class="bg-red-600 hover:bg-red-700 text-white
               px-5 py-2 rounded-lg font-medium transition">
        Logout
      </button>

    </div>

    <!-- TASK APP -->
    <app-task-modal></app-task-modal>

  </div>

</div>
